name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    name: Node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test (MCP server)
        run: npm test

      # The hooks are the only mechanism by which anything stored here reaches an
      # agent, and they had no tests at all while src/ had 39. They are plain
      # Python with no dependencies, so this needs no setup beyond the runner's
      # own interpreter.
      - name: Test (hooks)
        run: python3 -m unittest discover -s tests/hooks -v
